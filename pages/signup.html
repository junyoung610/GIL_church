<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 길교회</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div id="nav-placeholder"></div>

    <main class="auth-wrapper">
      <div class="auth-container">
        <h2>길교회 회원가입</h2>
        <!-- signup.html 의 form 부분 수정 -->
        <!-- signup.html 의 form 부분 전체 교체 -->
        <form id="signupForm">
          <!-- 프로필 사진 업로드 -->
          <div class="form-group" style="text-align: center; margin-bottom: 25px">
            <label for="profilePic" style="cursor: pointer">
              <div
                id="profilePreview"
                style="
                  width: 120px;
                  height: 120px;
                  border-radius: 50%;
                  background-color: #e2e8f0;
                  margin: 0 auto;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  overflow: hidden;
                  border: 2px dashed #cbd5e1;
                "
              >
                <span style="color: #64748b; font-size: 0.9rem">사진 등록</span>
              </div>
            </label>
            <input
              type="file"
              id="profilePic"
              accept=".jpg, .jpeg, .png, .webp"
              style="display: none"
            />
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 8px">
              * 최대 10MB (JPG, PNG, WEBP)
            </p>
          </div>

          <!-- 기본 정보 -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px">
            <div class="form-group">
              <label for="signupName">이름</label>
              <input type="text" id="signupName" required />
            </div>
            <div class="form-group">
              <label for="signupGender">성별</label>
              <select
                id="signupGender"
                required
                style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px"
              >
                <option value="남">남성</option>
                <option value="여">여성</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px">
            <div class="form-group">
              <label for="signupId">사용할 아이디</label>
              <input type="text" id="signupId" placeholder="영문/숫자 조합" required />
            </div>
            <div class="form-group">
              <label for="signupEmail">이메일</label>
              <input type="email" id="signupEmail" placeholder="user@email.com" />
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword">비밀번호</label>
            <input type="password" id="signupPassword" required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px">
            <div class="form-group">
              <label for="signupBirth">생년월일</label>
              <input type="date" id="signupBirth" />
            </div>
            <div class="form-group">
              <label for="signupPhone">연락처</label>
              <input type="tel" id="signupPhone" placeholder="010-0000-0000" required />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px">
            <div class="form-group">
              <label for="signupPosition">직분</label>
              <select
                id="signupPosition"
                required
                style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px"
              >
                <option value="성도">성도</option>
                <option value="집사">집사</option>
                <option value="안수집사">안수집사</option>
                <option value="권사">권사</option>
                <option value="장로">장로</option>
                <option value="교역자">교역자</option>
              </select>
            </div>
            <div class="form-group">
              <label for="signupGroup">소속부서</label>
              <select
                id="signupGroup"
                style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px"
              >
                <option value="새가족부">새가족부</option>
                <option value="1교구">1교구</option>
                <option value="2교구">2교구</option>
                <option value="청년부">청년부</option>
                <option value="주일학교">주일학교</option>
              </select>
            </div>
          </div>

          <!-- 주소 -->
          <div class="form-group">
            <label>주소</label>
            <div style="display: flex; gap: 10px; margin-bottom: 10px">
              <input type="text" id="signupZipcode" placeholder="우편번호" style="width: 100px" />
              <button
                type="button"
                style="
                  padding: 10px;
                  background: #e2e8f0;
                  border: none;
                  border-radius: 4px;
                  cursor: pointer;
                "
              >
                주소 검색
              </button>
            </div>
            <input
              type="text"
              id="signupAddress"
              placeholder="기본 주소"
              style="margin-bottom: 10px"
            />
            <input type="text" id="signupAddressDetail" placeholder="상세 주소" />
          </div>

          <!-- 신앙 이력 (선택 사항) -->
          <details
            style="
              margin-bottom: 20px;
              background: #f8fafc;
              padding: 15px;
              border-radius: 6px;
              border: 1px solid #e2e8f0;
            "
          >
            <summary style="font-weight: bold; cursor: pointer; color: #1e40af">
              신앙 이력 (선택입력)
            </summary>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px">
              <div class="form-group">
                <label>세례일</label>
                <input type="date" id="signupBaptismDate" />
              </div>
              <div class="form-group">
                <label>유아세례일</label>
                <input type="date" id="signupInfantBaptismDate" />
              </div>
              <div class="form-group">
                <label>입교일</label>
                <input type="date" id="signupConfirmationDate" />
              </div>
            </div>
          </details>

          <button type="submit" class="btn-auth">회원가입 (등록)</button>
          <div class="auth-links">
            <a href="login.html">이미 계정이 있으신가요? 로그인</a>
          </div>
        </form>
      </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
